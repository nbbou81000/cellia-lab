<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=480, initial-scale=1">
<title>CelliA Lab — TRMNL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:none; }
  html, body {
    width:800px; height:480px; overflow:hidden;
    background:#ffffff; color:#000000;
    font-family:'Bricolage Grotesque', sans-serif;
  }
  .mono { font-family:'JetBrains Mono', monospace; }

  #screen { width:800px; height:480px; padding:30px 34px 24px; position:relative; }
  #err { display:none; position:absolute; inset:0; align-items:center; justify-content:center; font-size:18px; text-align:center; padding:60px; }

  /* Header */
  .head { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2.5px solid #000; padding-bottom:12px; }
  .head-title { font-size:28px; font-weight:800; letter-spacing:-0.02em; display:flex; align-items:center; gap:10px; }
  .head-sub { font-size:13px; font-weight:600; color:#000; margin-top:3px; letter-spacing:.02em; }
  .head-right { text-align:right; }
  .head-date { font-size:13px; font-weight:700; }
  .head-time { font-size:11px; font-weight:500; opacity:.7; margin-top:2px; }

  /* Grands chiffres */
  .stats-row { display:flex; margin-top:22px; }
  .stat { flex:1; padding-right:26px; }
  .stat + .stat { border-left:1.5px solid #000; padding-left:26px; }
  .stat-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; opacity:.75; }
  .stat-value { font-size:44px; font-weight:800; letter-spacing:-0.03em; line-height:1.15; margin-top:2px; }
  .stat-value .unit { font-size:22px; font-weight:700; }
  .stat-sub { font-size:11.5px; font-weight:500; opacity:.7; margin-top:2px; }

  /* Graphique */
  .chart-block { margin-top:24px; }
  .chart-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; opacity:.75; margin-bottom:8px; }
  #chart-svg { display:block; }
  .bar { fill:#000; }
  .bar-today { fill:#000; }

  /* Sites */
  .sites-row { display:flex; gap:16px; margin-top:20px; }
  .site-card { flex:1; border:1.5px solid #000; border-radius:8px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  .site-name { font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .site-dot { width:9px; height:9px; border-radius:50%; background:#000; flex-shrink:0; }
  .site-dot.hollow { background:#fff; border:1.5px solid #000; }
  .site-figures { text-align:right; }
  .site-tokens { font-size:16px; font-weight:800; }
  .site-cost { font-size:11px; font-weight:500; opacity:.75; }

  /* Footer */
  .foot { position:absolute; left:34px; right:34px; bottom:20px; display:flex; justify-content:space-between; align-items:baseline; font-size:10.5px; font-weight:500; opacity:.7; border-top:1px solid #000; padding-top:8px; }
</style>
</head>
<body>
<div id="screen">

  <div class="head">
    <div>
      <div class="head-title">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="13" stroke="#000" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.55"/>
          <path d="M5.5 16 A10.5 10.5 0 0 1 16 5.5" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M26.5 16 A10.5 10.5 0 0 1 16 26.5" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="3.2" fill="#000"/>
          <circle cx="16" cy="16" r="1.5" fill="#fff"/>
        </svg>
        Tokens Mistral
      </div>
      <div class="head-sub" id="head-sub">CelliA + CelliA Lab</div>
    </div>
    <div class="head-right">
      <div class="head-date mono" id="head-date">—</div>
      <div class="head-time mono" id="head-time">—</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-label">Tokens cumulés</div>
      <div class="stat-value" id="v-total">—</div>
      <div class="stat-sub" id="v-since">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Coût estimé</div>
      <div class="stat-value" id="v-cost">—</div>
      <div class="stat-sub" id="v-runs">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Ce mois-ci</div>
      <div class="stat-value" id="v-month">—</div>
      <div class="stat-sub" id="v-month-cost">—</div>
    </div>
  </div>

  <div class="chart-block">
    <div class="chart-label">Tokens par jour — 14 derniers jours</div>
    <svg id="chart-svg" viewBox="0 0 732 72" width="732" height="72"></svg>
  </div>

  <div class="sites-row" id="sites-row"></div>

  <div class="foot">
    <span id="foot-baseline"></span>
    <span>nbbou81000.github.io/cellia-lab · TRMNL OG</span>
  </div>

  <div id="err">Pas de données pour l'instant.<br>Elles apparaissent après la première veille réussie.</div>
</div>

<script>
  const fr = n => Math.round(n ?? 0).toLocaleString('fr-FR');

  async function safeFetchJSON(url) {
    try {
      const res = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());
      if (!res.ok) return null;
      return await res.json();
    } catch { return null; }
  }

  function sumLifetime(sites) {
    return sites.reduce((a, s) => {
      const l = s.data.lifetime;
      a.totalTokens += l.totalTokens || 0; a.estCostUSD += l.estCostUSD || 0; a.runs += l.runs || 0;
      return a;
    }, { totalTokens: 0, estCostUSD: 0, runs: 0 });
  }

  function currentMonthAgg(sites) {
    const now = new Date();
    const inMonth = iso => { const d = new Date(iso); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); };
    return sites.reduce((a, s) => {
      s.data.history.forEach(r => { if (inMonth(r.date)) { a.totalTokens += r.totalTokens; a.estCostUSD += r.estCostUSD; } });
      return a;
    }, { totalTokens: 0, estCostUSD: 0 });
  }

  function aggregateByDay(sites, days) {
    const map = {};
    sites.forEach(s => s.data.history.forEach(r => {
      const day = r.date.slice(0, 10);
      map[day] = (map[day] || 0) + r.totalTokens;
    }));
    const today = new Date().toISOString().slice(0, 10);
    const allDays = Object.keys(map).sort();
    const last = allDays.slice(-days);
    return last.map(d => ({ date: d, tokens: map[d], isToday: d === today }));
  }

  function renderChart(days) {
    const svg = document.getElementById('chart-svg');
    if (!days.length) { svg.innerHTML = ''; return; }
    const W = 732, H = 72, GAP = 8;
    const barW = (W - GAP * (days.length - 1)) / days.length;
    const max = Math.max(1, ...days.map(d => d.tokens));
    let html = '';
    days.forEach((d, i) => {
      const h = Math.max(2, (d.tokens / max) * H);
      const x = i * (barW + GAP);
      const y = H - h;
      html += `<rect class="${d.isToday ? 'bar-today' : 'bar'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"/>`;
    });
    svg.innerHTML = html;
  }

  (async function load() {
    const [labData, celliaData] = await Promise.all([
      safeFetchJSON('dist/usage.json'),
      safeFetchJSON('../cellia/dist/usage.json'),
    ]);
    const sites = [
      { key: 'lab', label: 'CelliA Lab', data: labData },
      { key: 'cellia', label: 'CelliA', data: celliaData },
    ].filter(s => s.data && s.data.history?.length && s.data.lifetime);

    if (!sites.length) { document.getElementById('err').style.display = 'flex'; return; }

    const life  = sumLifetime(sites);
    const month = currentMonthAgg(sites);
    const now   = new Date();

    document.getElementById('head-date').textContent = now.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
    document.getElementById('head-time').textContent  = 'Généré à ' + now.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('head-sub').textContent   = sites.length === 2 ? 'CelliA + CelliA Lab' : sites[0].label;

    document.getElementById('v-total').textContent = fr(life.totalTokens);
    const oldestSince = sites.map(s => s.data.lifetime.since).sort()[0];
    document.getElementById('v-since').textContent = 'depuis le ' + new Date(oldestSince).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });

    document.getElementById('v-cost').innerHTML = life.estCostUSD.toFixed(2) + '<span class="unit"> $</span>';
    document.getElementById('v-runs').textContent = life.runs + ' runs au total';

    document.getElementById('v-month').textContent = fr(month.totalTokens);
    document.getElementById('v-month-cost').textContent = month.estCostUSD.toFixed(4) + ' $ estimés';

    renderChart(aggregateByDay(sites, 14));

    const order = ['lab', 'cellia'];
    document.getElementById('sites-row').innerHTML = order
      .map(k => sites.find(s => s.key === k))
      .filter(Boolean)
      .map((s, i) => `
        <div class="site-card">
          <div class="site-name"><span class="site-dot${i === 1 ? ' hollow' : ''}"></span>${s.label}</div>
          <div class="site-figures">
            <div class="site-tokens">${fr(s.data.lifetime.totalTokens)}</div>
            <div class="site-cost">${s.data.lifetime.estCostUSD.toFixed(2)} $ · ${s.data.lifetime.runs} runs</div>
          </div>
        </div>`).join('');

    const baseline = labData?.baseline;
    document.getElementById('foot-baseline').textContent = baseline?.amountEUR != null
      ? `Relevé manuel : ${baseline.amountEUR.toFixed(2)} € au ${new Date(baseline.date).toLocaleDateString('fr-FR', { day:'numeric', month:'short' })}`
      : 'Aucun relevé manuel enregistré';
  })();
</script>
</body>
</html>
